<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>guides</title>
<meta name="theme-color" content="#0a0a0a">
<link rel="stylesheet" href="/js/xterm/xterm.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0a0a0a}
body{display:flex;flex-direction:column}
#t{flex:1;overflow:hidden;padding:6px}
.xterm{height:100%}
.xterm-viewport{background:#0a0a0a!important}
</style>
</head>
<body>
<div id="t"></div>
<script src="/js/xterm/xterm.js"></script>
<script src="/js/xterm/addon-fit.js"></script>
<script src="/js/xterm/addon-web-links.js"></script>
<script src="/js/guides-data.js"></script>
<script>
const term = new Terminal({
  fontFamily:"'JetBrains Mono','Fira Code','Cascadia Code','SF Mono',Consolas,monospace",
  fontSize:13, lineHeight:1.5, cursorBlink:true, cursorStyle:'block',
  scrollback:5000, convertEol:true, copyOnSelect:true, macOptionIsMeta:true,
  theme:{
    background:'#0a0a0a', foreground:'#e0e0e0', cursor:'#00cc66', cursorAccent:'#0a0a0a',
    black:'#0a0a0a', brightBlack:'#333', white:'#e0e0e0', brightWhite:'#f0f0f0',
    green:'#00cc66', brightGreen:'#00ff87', cyan:'#79d4f0', brightCyan:'#79d4f0',
    red:'#ff6b6b', brightRed:'#ff6b6b', yellow:'#ffd060', blue:'#79d4f0', magenta:'#c792ea',
  },
});
const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.loadAddon(new WebLinksAddon.WebLinksAddon());
term.open(document.getElementById('t'));
fit.fit();
window.addEventListener('resize', () => fit.fit());

// ANSI
const R='\x1b[0m',DIM='\x1b[2m',BOLD='\x1b[1m';
const GREEN='\x1b[32m',CYAN='\x1b[36m',BCYAN='\x1b[96m';
const RED='\x1b[31m',YELLOW='\x1b[33m',WHITE='\x1b[37m';
const dim=s=>DIM+s+R, bold=s=>BOLD+s+R, green=s=>GREEN+s+R;
const cyan=s=>CYAN+s+R, bcyan=s=>BCYAN+s+R, red=s=>RED+s+R;
const yellow=s=>YELLOW+s+R, white=s=>WHITE+s+R;

// State
let cwd='/', buf='', hist=[], hi=-1, busy=false;

// Write helpers
const wl=s=>term.writeln(s??'');
const w=s=>term.write(s??'');
const nl=()=>term.writeln('');
const err=s=>wl(red(s));
const prompt=()=>green(cwd==='/'?'$':cwd.slice(1)+' $')+' ';
const writePrompt=()=>w(prompt());

// Copy / Paste
term.attachCustomKeyEventHandler(e => {
  if ((e.metaKey||(e.ctrlKey&&e.shiftKey)) && e.key==='c' && e.type==='keydown') {
    const s=term.getSelection(); if(s) navigator.clipboard.writeText(s); return false;
  }
  if ((e.metaKey||(e.ctrlKey&&e.shiftKey)) && e.key==='v' && e.type==='keydown') {
    navigator.clipboard.readText().then(t=>{
      if(!t) return;
      for(const ch of t) { if(ch==='\n'||ch==='\r') runCmd(buf); else {buf+=ch;w(ch);} }
    }).catch(()=>{});
    return false;
  }
  return true;
});

// HTML → ANSI
function htmlToAnsi(html) {
  const d=document.createElement('div'); d.innerHTML=html;
  function walk(n) {
    if(n.nodeType===3) return n.textContent;
    const tag=(n.tagName||'').toLowerCase();
    const ch=Array.from(n.childNodes).map(walk).join('');
    switch(tag) {
      case 'h1': return '\r\n'+bold(WHITE+ch+R)+'\r\n'+dim('─'.repeat(Math.min(ch.length,56)))+'\r\n';
      case 'h2': return '\r\n'+green(ch.toUpperCase())+'\r\n';
      case 'h3': return '\r\n'+bold(ch)+'\r\n';
      case 'p':  return ch+'\r\n';
      case 'ul': case 'ol': return ch;
      case 'li': return '  '+dim('·')+' '+ch+'\r\n';
      case 'code': return n.closest&&n.closest('pre') ? ch : green(ch);
      case 'pre': return '\r\n'+ch.split('\n').map(l=>'  '+bcyan(l)).join('\r\n')+'\r\n';
      case 'strong': case 'b': return bold(ch);
      case 'a': {
        const href=n.getAttribute&&n.getAttribute('href');
        if(href&&href.startsWith('magnet:')) return yellow('[magnet] ')+cyan(href);
        return cyan(ch);
      }
      case 'blockquote': return dim('  | '+ch.trim())+'\r\n';
      case 'br': return '\r\n';
      case 'hr': return dim('─'.repeat(40))+'\r\n';
      case 'th': return dim(ch.toUpperCase().padEnd(22));
      case 'td': return ch.padEnd(22);
      case 'tr': return ch+'\r\n';
      case 'table': return '\r\n'+ch+'\r\n';
      case 'thead': return dim(ch);
      case 'tbody': return ch;
      default: return ch;
    }
  }
  return walk(d);
}

// Commands
function curSec() { return cwd==='/' ? null : SECTIONS.find(s=>s.id===cwd.slice(1)); }

function cmdLs() {
  if(cwd==='/') {
    SECTIONS.filter(s=>s.guides.length).forEach(s=>wl(cyan(s.id+'/')+dim('  '+s.guides.length)));
  } else {
    const sec=curSec(); if(!sec){err('ls: no such section');return;}
    sec.guides.forEach(g=>wl(dim(g.slug.padEnd(52))+' '+g.title));
  }
}

function cmdCd(arg) {
  if(!arg||arg==='~'||arg==='/'||arg==='..'){cwd='/';return;}
  const sec=SECTIONS.find(s=>s.id===arg||s.title.toLowerCase()===arg.toLowerCase());
  if(!sec){err(`cd: ${arg}: no such section`);return;}
  cwd='/'+sec.id; nl(); cmdLs();
}

async function catGuide(slug) {
  const guide=ALL_GUIDES.find(g=>g.slug===slug);
  if(!guide){err(`cat: ${slug}: no such guide`);return;}
  busy=true;
  try {
    const resp=await fetch(`/guides/${guide.slug}.html`);
    if(!resp.ok) throw new Error();
    const raw=await resp.text();
    const html=raw.split('\n').slice(2).join('\n');
    term.reset();
    htmlToAnsi(html).split('\r\n').forEach(l=>wl(l));
    requestAnimationFrame(()=>term.scrollToTop());
  } catch(e) {
    err(`cat: failed to load ${guide.slug}.html`);
  } finally {
    busy=false; nl(); writePrompt(); buf='';
  }
}

function cmdHelp() {
  nl();
  [['ls','list sections or guides'],['cd <section>','enter a section'],
   ['cd ..','back to root'],['cat <slug>','open a guide'],
   ['github','open GitHub repo'],['clear','clear screen'],['help','show this']
  ].forEach(([c,d])=>wl(green(c.padEnd(20))+dim(d)));
  nl();
}

// Dispatch
function runCmd(raw) {
  if(busy) return;
  const cmd=raw.trim(); nl();
  if(!cmd){writePrompt();buf='';return;}
  hist.unshift(cmd); hi=-1;
  const parts=cmd.split(/\s+/), verb=parts[0].toLowerCase();
  const arg=parts.slice(1).join(' ').replace(/\.html$/,'').trim();
  switch(verb) {
    case 'ls': case 'dir': nl(); cmdLs(); break;
    case 'cd': cmdCd(arg); break;
    case 'cat': case 'open': case 'read':
      if(!arg){err('cat: missing filename');break;}
      catGuide(arg); return;
    case 'clear': case 'cls': term.reset(); writePrompt(); buf=''; return;
    case 'help': case '?': cmdHelp(); break;
    case 'github': case 'gh':
      nl(); wl(cyan('opening github.com/eliekh05/guides...'));
      setTimeout(()=>window.open('https://github.com/eliekh05/guides','_blank'),300);
      break;
    case 'pwd': nl(); wl(cwd==='/'?'/':'/'+cwd.slice(1)); break;
    case 'exit': case 'quit': nl(); wl(dim('there is no exit.')); break;
    default: err(`${verb}: command not found  (try: ls  cd  cat  help)`); break;
  }
  nl(); writePrompt(); buf='';
}

// Tab completion
function tabComplete() {
  const parts=buf.trim().split(/\s+/), verb=parts[0].toLowerCase();
  const frag=(parts[parts.length-1]||'').toLowerCase();
  let done=null;
  if(verb==='cd'&&parts.length>=2) {
    const m=SECTIONS.find(s=>s.id.startsWith(frag)); if(m) done='cd '+m.id;
  } else if((verb==='cat'||verb==='open')&&parts.length>=2) {
    const pool=curSec()?.guides||ALL_GUIDES;
    const m=pool.find(g=>g.slug.startsWith(frag)); if(m) done=verb+' '+m.slug;
  } else if(parts.length===1) {
    const m=['ls','cd','cat','clear','help','pwd','github'].find(v=>v.startsWith(frag));
    if(m) done=m;
  }
  if(done&&done!==buf){w('\b \b'.repeat(buf.length));w(done);buf=done;}
}

// Auto-suggest after 10 chars
function autoSuggest() {
  const parts=buf.trim().split(/\s+/), verb=parts[0].toLowerCase();
  const frag=(parts[parts.length-1]||'').toLowerCase();
  if(frag.length<10) return;
  if((verb==='cat'||verb==='open')&&parts.length>=2) tabComplete();
  else if(verb==='cd'&&parts.length>=2) tabComplete();
}

// Input
term.onData(e=>{
  if(busy) return;
  if(e==='\r'){runCmd(buf);}
  else if(e==='\x7f'){if(buf.length){buf=buf.slice(0,-1);w('\b \b');}}
  else if(e==='\t'){tabComplete();}
  else if(e==='\x1b[A'){if(hi<hist.length-1){hi++;w('\b \b'.repeat(buf.length));w(hist[hi]);buf=hist[hi];}}
  else if(e==='\x1b[B'){if(hi>0){hi--;w('\b \b'.repeat(buf.length));w(hist[hi]);buf=hist[hi];}else{w('\b \b'.repeat(buf.length));hi=-1;buf='';}}
  else if(e==='\x01'){w('\b \b'.repeat(buf.length));buf='';}
  else if(e==='\x0c'){term.reset();writePrompt();buf='';}
  else if(e.length===1&&e>=' '){buf+=e;w(e);autoSuggest();}
});

// Boot
setTimeout(()=>{
  const W=Math.max(60,term.cols-4);
  const pad=(s,w)=>{const l=s.replace(/\x1b\[[0-9;]*m/g,'').length;return s+' '.repeat(Math.max(0,w-l));};
  const line=(s='')=>wl(dim('│')+' '+pad(s,W-4)+' '+dim('│'));
  wl(dim('┌'+'─'.repeat(W-2)+'┐'));
  line(); line(bold(white('OS & Installation Guides')));
  line(dim(ALL_GUIDES.length+' guides across '+SECTIONS.filter(s=>s.guides.length).length+' sections'));
  line();
  line(dim('practical guides for problems that are hard to find solutions for online.'));
  line(); line(dim('last login: '+new Date().toDateString().toLowerCase()));
  line(); line(dim('type ')+green('ls')+dim(' to browse  ·  ')+green('help')+dim(' for all commands'));
  line();
  wl(dim('└'+'─'.repeat(W-2)+'┘'));
  nl(); writePrompt();
},100);
</script>
</body>
</html>
