<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>guides</title>

<meta name="theme-color" content="#0a0a0a">

<link rel="stylesheet" href="/js/xterm/xterm.css">

<style>
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0a0a0a;
}

body {
  display: flex;
  flex-direction: column;
}

#terminal-container {
  flex: 1;
  width: 100%;
  height: 100%;
  overflow: hidden;
  padding: 6px;
}

.xterm {
  height: 100%;
}

.xterm-viewport {
  background: #0a0a0a !important;
}

.xterm-screen {
  padding-left: 4px;
}
</style>
</head>

<body>

<div
  id="terminal-container"
  role="application"
  aria-label="Interactive terminal">
</div>


<script src="/js/xterm/xterm.js"></script>
<script src="/js/xterm/addon-fit.js"></script>
<script src="/js/xterm/addon-web-links.js"></script>
<script src="/js/guides-data.js"></script>


<script>

/* ============================================================
   Terminal
============================================================ */

const term = new Terminal({

  fontFamily:
    "'JetBrains Mono','Fira Code','Cascadia Code','SF Mono',Consolas,monospace",

  fontSize: 13,

  lineHeight: 1.5,

  cursorBlink: true,

  cursorStyle: "block",

  scrollback: 5000,

  convertEol: true,

  macOptionIsMeta: true,

  theme: {

    background: "#0a0a0a",

    foreground: "#e0e0e0",

    cursor: "#00cc66",

    cursorAccent: "#0a0a0a",

    black: "#0a0a0a",

    brightBlack: "#333333",

    white: "#e0e0e0",

    brightWhite: "#ffffff",

    green: "#00cc66",

    brightGreen: "#00ff87",

    cyan: "#79d4f0",

    brightCyan: "#79d4f0",

    red: "#ff6b6b",

    brightRed: "#ff6b6b",

    yellow: "#ffd060",

    blue: "#79d4f0",

    magenta: "#c792ea"
  }
});


const fitAddon = new FitAddon.FitAddon();

term.loadAddon(fitAddon);

term.loadAddon(
  new WebLinksAddon.WebLinksAddon()
);


const container =
  document.getElementById("terminal-container");


term.open(container);


function resizeTerminal(){

  requestAnimationFrame(() => {

    fitAddon.fit();

  });

}


resizeTerminal();


window.addEventListener(
  "resize",
  resizeTerminal
);


/* ============================================================
   ANSI helpers
============================================================ */

const ANSI = {

  reset: "\x1b[0m",

  bold: "\x1b[1m",

  dim: "\x1b[2m",

  colors: {

    green: "\x1b[32m",

    brightGreen: "\x1b[92m",

    cyan: "\x1b[36m",

    brightCyan: "\x1b[96m",

    red: "\x1b[31m",

    yellow: "\x1b[33m",

    white: "\x1b[37m"

  }

};


const style = (code,text)=>{

  return code + text + ANSI.reset;

};


const bold =
  text => style(ANSI.bold,text);


const dim =
  text => style(ANSI.dim,text);


const green =
  text => style(ANSI.colors.green,text);


const cyan =
  text => style(ANSI.colors.cyan,text);


const brightCyan =
  text => style(ANSI.colors.brightCyan,text);


const red =
  text => style(ANSI.colors.red,text);


const yellow =
  text => style(ANSI.colors.yellow,text);


const white =
  text => style(ANSI.colors.white,text);



/* ============================================================
   Output helpers
============================================================ */


const write =
  text => term.write(text ?? "");


const println =
  text => term.writeln(text ?? "");


const newline =
  () => term.writeln("");



function clearTerminal(){

  term.clear();

  term.write("\x1b[H");

}



/* ============================================================
   Shell state
============================================================ */


const state = {

  cwd: "/",

  input: "",

  history: [],

  historyIndex: -1,

  busy: false

};



/* ============================================================
   Prompt
============================================================ */


function prompt(){

  if(state.cwd === "/"){

    return green("$") + " ";

  }


  return (
    green(
      state.cwd.slice(1)
    )
    +
    " $ "
  );

}



function printPrompt(){

  write(prompt());

}



function error(message){

  println(
    red(message)
  );

}



/* ============================================================
   Clipboard
============================================================ */


async function copySelection(){

  const text =
    term.getSelection();


  if(!text)
    return;


  try{

    await navigator.clipboard.writeText(text);

  }

  catch(err){

    console.warn(
      "Clipboard failed",
      err
    );

  }

}



async function pasteClipboard(){

  try{

    const text =
      await navigator.clipboard.readText();


    if(!text)
      return;


    for(const char of text){

      if(char === "\n"){

        runCommand(state.input);

      }

      else{

        state.input += char;

        write(char);

      }

    }

  }

  catch(err){

    console.warn(
      "Paste failed",
      err
    );

  }

}



/* ============================================================
   Keyboard shortcuts
============================================================ */


term.attachCustomKeyEventHandler(
event=>{


  if(
    event.type === "keydown"
    &&
    (event.metaKey ||
    (event.ctrlKey && event.shiftKey))
    &&
    event.key.toLowerCase()==="c"
  ){

    copySelection();

    return false;

  }



  if(
    event.type === "keydown"
    &&
    (event.metaKey ||
    (event.ctrlKey && event.shiftKey))
    &&
    event.key.toLowerCase()==="v"
  ){

    pasteClipboard();

    return false;

  }


  return true;

});

/* ============================================================
   HTML -> ANSI renderer
============================================================ */


function stripHTMLTags(text){

  return text
    .replace(/<[^>]*>/g,"")
    .replace(/\s+/g," ")
    .trim();

}



function htmlToAnsi(html){

  const parser =
    new DOMParser();


  const doc =
    parser.parseFromString(
      html,
      "text/html"
    );


  function walk(node){

    if(node.nodeType === Node.TEXT_NODE){

      return node.textContent;

    }


    if(node.nodeType !== Node.ELEMENT_NODE){

      return "";

    }


    const tag =
      node.tagName.toLowerCase();


    const children =
      Array.from(node.childNodes)
      .map(walk)
      .join("");



    switch(tag){


      case "h1":

        return (
          "\r\n" +
          bold(
            white(
              children.trim()
            )
          )
          +
          "\r\n" +
          dim(
            "─".repeat(
              Math.min(
                children.length,
                60
              )
            )
          )
          +
          "\r\n"
        );



      case "h2":

        return (
          "\r\n" +
          green(
            children.toUpperCase()
          )
          +
          "\r\n"
        );



      case "h3":

        return (
          "\r\n" +
          bold(children)
          +
          "\r\n"
        );



      case "p":

        return children + "\r\n";



      case "br":

        return "\r\n";



      case "strong":
      case "b":

        return bold(children);



      case "code":

        if(node.parentElement?.tagName.toLowerCase()==="pre"){

          return children;

        }

        return green(children);



      case "pre":

        return (
          "\r\n" +
          children
          .split("\n")
          .map(
            line =>
              "  " +
              brightCyan(line)
          )
          .join("\r\n")
          +
          "\r\n"
        );



      case "ul":
      case "ol":

        return children;



      case "li":

        return (
          "  " +
          dim("•") +
          " " +
          children +
          "\r\n"
        );



      case "blockquote":

        return (
          dim(
            "  | " +
            children.trim()
          )
          +
          "\r\n"
        );



      case "hr":

        return (
          dim(
            "─".repeat(50)
          )
          +
          "\r\n"
        );



      case "a":

        return cyan(children);



      case "table":

        return (
          "\r\n" +
          children +
          "\r\n"
        );



      case "tr":

        return children + "\r\n";



      case "th":

        return dim(
          children.padEnd(20)
        );



      case "td":

        return children.padEnd(20);



      default:

        return children;

    }

  }


  return walk(doc.body);

}





/* ============================================================
   Guide helpers
============================================================ */


function currentSection(){

  if(state.cwd === "/")
    return null;


  return SECTIONS.find(
    section =>
      section.id === state.cwd.slice(1)
  );

}





function getGuides(){

  const section =
    currentSection();


  return section
    ? section.guides
    : ALL_GUIDES;

}





/* ============================================================
   Commands
============================================================ */


function commandLS(){

  if(state.cwd === "/"){


    SECTIONS
    .filter(
      s=>s.guides.length
    )
    .forEach(section=>{


      println(
        cyan(section.id + "/")
        +
        dim(
          "  " +
          section.guides.length
        )
      );


    });


    return;

  }



  const section =
    currentSection();



  if(!section){

    error(
      "ls: invalid directory"
    );

    return;

  }



  section.guides.forEach(
    guide=>{

      println(
        dim(
          guide.slug.padEnd(45)
        )
        +
        guide.title
      );

    }
  );


}





function commandCD(argument){


  if(
    !argument ||
    argument===".." ||
    argument==="/" ||
    argument==="~"
  ){

    state.cwd="/";

    return;

  }



  const section =
    SECTIONS.find(
      s =>
      s.id===argument
      ||
      s.title.toLowerCase()
      ===
      argument.toLowerCase()
    );



  if(!section){

    error(
      `cd: ${argument}: no such section`
    );

    return;

  }



  state.cwd =
    "/" + section.id;


  newline();

  commandLS();


}





async function commandCAT(slug){


  const guide =
    ALL_GUIDES.find(
      g =>
      g.slug===slug
    );



  if(!guide){

    error(
      `cat: ${slug}: not found`
    );

    return;

  }



  state.busy=true;



  try{


    const response =
      await fetch(
        `/guides/${guide.slug}.html`
      );


    if(!response.ok)
      throw new Error();



    const html =
      await response.text();



    const output =
      htmlToAnsi(html);



    newline();


    output
    .split("\r\n")
    .forEach(
      line =>
        println(line)
    );



    term.scrollToBottom();



  }


  catch(err){

    error(
      `cat: failed loading ${slug}`
    );

  }



  finally{

    state.busy=false;

    newline();

    printPrompt();

    state.input="";

  }


}






function commandHELP(){


  newline();


  const commands=[

    ["ls","list sections or guides"],

    ["cd <section>","enter section"],

    ["cat <guide>","open guide"],

    ["clear","clear terminal"],

    ["pwd","show current path"],

    ["github","open repository"],

    ["help","show commands"]

  ];



  commands.forEach(
    ([cmd,desc])=>{

      println(
        green(
          cmd.padEnd(20)
        )
        +
        dim(desc)
      );

    }
  );


  newline();

}




function runCommand(raw){


  if(state.busy)
    return;



  const command =
    raw.trim();



  newline();



  if(!command){

    printPrompt();

    return;

  }



  state.history.unshift(command);

  state.historyIndex=-1;



  const parts =
    command.split(/\s+/);



  const name =
    parts[0].toLowerCase();


  const args =
    parts
    .slice(1)
    .join(" ")
    .replace(/\.html$/,"");




  switch(name){


    case "ls":
    case "dir":

      commandLS();

      break;



    case "cd":

      commandCD(args);

      break;



    case "cat":
    case "open":

      commandCAT(args);

      return;



    case "help":

      commandHELP();

      break;



    case "clear":
    case "cls":

      clearTerminal();

      break;



    case "pwd":

      println(
        state.cwd
      );

      break;



    case "github":

      println(
        cyan(
          "opening github..."
        )
      );


      setTimeout(
        ()=>window.open(
          "https://github.com/eliekh05/guides",
          "_blank",
          "noopener,noreferrer"
        ),
        300
      );

      break;



    default:

      error(
        `${name}: command not found`
      );


  }



  newline();

  printPrompt();

  state.input="";


}
/* ============================================================
   Tab completion
============================================================ */


function tabComplete(){


  const parts =
    state.input
    .trim()
    .split(/\s+/);



  const command =
    parts[0]
    ?.toLowerCase();



  const fragment =
    parts.at(-1)
    ?.toLowerCase() || "";



  let result=null;



  if(
    command==="cd"
    &&
    parts.length>=2
  ){


    const match =
      SECTIONS.find(
        s =>
        s.id.startsWith(fragment)
      );


    if(match)
      result =
        "cd " + match.id;

  }



  else if(
    (command==="cat" ||
     command==="open")
     &&
     parts.length>=2
  ){


    const guides =
      getGuides();


    const match =
      guides.find(
        g =>
        g.slug.startsWith(fragment)
      );


    if(match)
      result =
        command +
        " " +
        match.slug;


  }



  else if(parts.length===1){


    const commands=[

      "ls",
      "cd",
      "cat",
      "clear",
      "pwd",
      "github",
      "help"

    ];



    const match =
      commands.find(
        c =>
        c.startsWith(fragment)
      );


    if(match)
      result=match;


  }



  if(
    result &&
    result!==state.input
  ){


    eraseInput();


    state.input=result;


    write(result);

  }


}





/* ============================================================
   Erase current line
============================================================ */


function eraseInput(){


  if(!state.input)
    return;



  write(
    "\b \b".repeat(
      state.input.length
    )
  );


}





/* ============================================================
   Keyboard input
============================================================ */


term.onData(data=>{


  if(state.busy)
    return;




  switch(data){



    case "\r":

      runCommand(
        state.input
      );

      break;



    case "\x7f":


      if(state.input.length){

        state.input =
          state.input.slice(
            0,-1
          );

        write("\b \b");

      }


      break;




    case "\t":

      tabComplete();

      break;




    case "\x1b[A":


      if(
        state.history.length
      ){


        if(
          state.historyIndex <
          state.history.length-1
        ){

          state.historyIndex++;

          eraseInput();


          state.input =
            state.history[
              state.historyIndex
            ];


          write(
            state.input
          );

        }

      }


      break;




    case "\x1b[B":


      if(
        state.historyIndex>=0
      ){


        state.historyIndex--;


        eraseInput();


        if(
          state.historyIndex>=0
        ){

          state.input =
            state.history[
              state.historyIndex
            ];


          write(
            state.input
          );


        }

        else{

          state.input="";

        }

      }


      break;




    case "\x0c":

      clearTerminal();

      printPrompt();

      state.input="";

      break;



    default:


      if(
        data.length===1 &&
        data>=" "
      ){

        state.input+=data;

        write(data);

      }


  }


});







/* ============================================================
   Boot banner
============================================================ */


function drawBanner(){


  const count =
    ALL_GUIDES.length;



  const sections =
    SECTIONS.filter(
      s=>s.guides.length
    ).length;



  const width =
    Math.max(
      60,
      term.cols-6
    );



  const clean =
    text =>
    text.replace(
      /\x1b\[[0-9;]*m/g,
      ""
    );



  function box(text=""){


    const length =
      clean(text).length;


    return (
      dim("  │")
      +
      text
      +
      " ".repeat(
        Math.max(
          0,
          width-length
        )
      )
      +
      dim("│")
    );


  }



  const top =
    dim(
      "  ┌" +
      "─".repeat(width) +
      "┐"
    );



  const bottom =
    dim(
      "  └" +
      "─".repeat(width) +
      "┘"
    );



  const lines=[


    "",


    top,


    box(),


    box(
      "    "+
      bold(
        white(
          "OS & Installation Guides"
        )
      )
    ),



    box(
      "    "+
      dim(
        `${count} guides across ${sections} sections`
      )
    ),



    box(),



    box(
      "    "+
      dim(
        "practical guides for problems"
      )
    ),


    box(
      "    "+
      dim(
        "that are hard to find online."
      )
    ),


    box(),


    bottom,


    "",


    "  "+
    dim(
      "last login: "+
      new Date()
      .toDateString()
    ),


    "",


    "  "+
    dim("type ")
    +
    green("ls")
    +
    dim(" to browse")
    +
    dim("  ·  ")
    +
    green("help")
    +
    dim(" for commands"),


    ""

  ];



  lines.forEach(
    line=>println(line)
  );


}





/* ============================================================
   Startup
============================================================ */


setTimeout(()=>{


  drawBanner();


  setTimeout(()=>{


    printPrompt();


  },150);



},100);



</script>

</body>
</html>
