<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OS & Installation Guides</title>
<meta name="description" content="Practical guides for problems that are hard to find solutions for online.">
<meta name="theme-color" content="#0a0a0a">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#0a0a0a;
  --bg2:#111;
  --bg3:#161616;
  --border:#1e1e1e;
  --text:#e0e0e0;
  --muted:#666;
  --dim:#333;
  --accent:#00cc66;
  --blue:#79d4f0;
  --red:#ff6b6b;
  --yellow:#ffd060;
  --mono:'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --header:48px;
}

html,body{height:100%;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
body{font-family:var(--sans);font-size:15px;line-height:1.6}

/* ── HEADER ── */
.hdr{
  position:fixed;top:0;left:0;right:0;height:var(--header);z-index:100;
  background:rgba(10,10,10,.95);border-bottom:1px solid var(--border);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:flex;align-items:center;gap:10px;padding:0 14px;
}
.hdr-logo{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--accent);text-decoration:none;white-space:nowrap;flex-shrink:0}
.hdr-logo span{color:var(--muted);font-weight:400}
.hdr-search{
  flex:1;height:32px;background:var(--bg2);border:1px solid var(--border);
  border-radius:8px;padding:0 10px;font-size:14px;font-family:var(--sans);
  color:var(--text);outline:none;transition:border-color .15s;
}
.hdr-search:focus{border-color:rgba(0,204,102,.4)}
.hdr-search::placeholder{color:var(--muted)}
.menu-btn{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px;flex-shrink:0;line-height:1}
.hdr-gh{font-size:12px;color:var(--muted);text-decoration:none;flex-shrink:0;display:none}
.hdr-gh:hover{color:var(--accent)}

/* ── LAYOUT ── */
.layout{display:flex;padding-top:var(--header);min-height:100vh}

/* ── SIDEBAR ── */
.sidebar{
  width:260px;flex-shrink:0;position:fixed;top:var(--header);left:-260px;
  bottom:0;overflow-y:auto;background:#0d0d0d;border-right:1px solid var(--border);
  padding:8px 0 60px;z-index:99;transition:left .25s ease;
  scrollbar-width:thin;scrollbar-color:#1e1e1e transparent;
}
.sidebar.open{left:0;box-shadow:8px 0 32px rgba(0,0,0,.7)}
.sidebar::-webkit-scrollbar{width:3px}
.sidebar::-webkit-scrollbar-thumb{background:#1e1e1e}

.sb-root{font-size:10px;color:var(--dim);padding:8px 14px 10px;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--border);margin-bottom:4px}
.sb-sec{cursor:pointer}
.sb-sec-hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 14px;font-size:13px;color:var(--muted);
  transition:color .1s,background .1s;user-select:none;
}
.sb-sec-hdr:hover{color:var(--text);background:var(--bg3)}
.sb-sec-hdr.open{color:var(--accent)}
.sb-sec-hdr .chev{font-size:10px;color:var(--dim);transition:transform .15s}
.sb-sec-hdr.open .chev{transform:rotate(90deg);color:var(--accent);opacity:.5}
.sb-sec-count{font-size:11px;color:var(--dim)}
.sb-guides{display:none}
.sb-sec-hdr.open+.sb-guides{display:block}
.sb-link{
  display:block;padding:5px 14px 5px 24px;font-size:12px;color:#555;
  text-decoration:none;line-height:1.5;transition:color .1s,background .1s;
}
.sb-link:hover{color:var(--text);background:var(--bg3)}
.sb-link.active{color:var(--accent);background:rgba(0,204,102,.06)}

/* ── MAIN ── */
.main{flex:1;width:100%;min-width:0}
.content{padding:20px 16px 80px;max-width:680px;margin:0 auto}

/* ── HOME ── */
.home-hero{margin-bottom:20px}
.home-title{font-size:22px;font-weight:700;color:var(--text);margin-bottom:6px;letter-spacing:-.02em}
.home-title span{color:var(--accent)}
.home-sub{font-size:14px;color:var(--muted);line-height:1.6}

.search-bar-big{
  width:100%;height:44px;background:var(--bg2);border:1px solid var(--border);
  border-radius:10px;padding:0 14px;font-size:15px;font-family:var(--sans);
  color:var(--text);outline:none;margin-bottom:20px;transition:border-color .15s;
  -webkit-appearance:none;
}
.search-bar-big:focus{border-color:rgba(0,204,102,.4)}
.search-bar-big::placeholder{color:var(--muted)}

.sections-grid{display:flex;flex-direction:column;gap:1px;background:var(--border);border-radius:10px;overflow:hidden;margin-bottom:16px}
.sec-card{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;background:var(--bg2);text-decoration:none;
  transition:background .1s;cursor:pointer;
}
.sec-card:hover{background:var(--bg3)}
.sec-card:active{background:#1a1a1a}
.sec-left{display:flex;align-items:center;gap:12px}
.sec-num{font-size:20px;font-weight:700;color:var(--accent);font-family:var(--mono);min-width:36px;line-height:1}
.sec-name{font-size:15px;color:var(--text);font-weight:500}
.sec-arr{color:var(--dim);font-size:16px}

.notice{
  padding:12px 14px;background:var(--bg2);border-radius:8px;
  font-size:13px;color:var(--muted);line-height:1.65;
  border-left:2px solid var(--dim);margin-bottom:8px;
}
.notice.warn{border-left-color:var(--yellow)}
.notice.info{border-left-color:var(--blue)}

/* ── SECTION PAGE ── */
.page-title{font-size:20px;font-weight:700;color:var(--text);margin-bottom:4px;letter-spacing:-.01em}
.page-sub{font-size:13px;color:var(--muted);margin-bottom:16px}
.back-btn{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--muted);text-decoration:none;margin-bottom:14px;padding:4px 0}
.back-btn:hover{color:var(--accent)}

.guide-list{display:flex;flex-direction:column;gap:1px;background:var(--border);border-radius:10px;overflow:hidden}
.guide-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 16px;background:var(--bg2);text-decoration:none;
  color:var(--text);transition:background .1s;
}
.guide-item:hover{background:var(--bg3)}
.guide-item:active{background:#1a1a1a}
.guide-item-title{font-size:14px;line-height:1.4;padding-right:10px}
.guide-item-arr{color:var(--dim);font-size:14px;flex-shrink:0}

/* ── GUIDE CONTENT ── */
.guide-body{font-size:15px}
.guide-body h1{font-size:20px;font-weight:700;color:var(--text);margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--border);line-height:1.3;letter-spacing:-.02em}
.guide-body h2{font-size:11px;font-weight:700;color:var(--accent);margin:24px 0 10px;letter-spacing:.08em;text-transform:uppercase}
.guide-body h3{font-size:15px;font-weight:600;color:#ddd;margin:18px 0 7px}
.guide-body p{margin-bottom:10px;font-size:14px;line-height:1.75;color:#bbb}
.guide-body a{color:var(--accent);text-decoration:none;word-break:break-all}
.guide-body a:hover{text-decoration:underline}
.guide-body hr{border:none;border-top:1px solid var(--border);margin:20px 0}
.guide-body strong{color:var(--text);font-weight:600}
.guide-body blockquote{border-left:2px solid var(--yellow);padding:8px 12px;margin:0 0 12px;background:rgba(255,208,96,.04);font-size:13px;color:#999;border-radius:0 6px 6px 0}
.guide-body blockquote p{margin:0;color:#999;font-size:13px}

.guide-body ul{margin:0 0 12px 18px}
.guide-body ul li{margin-bottom:5px;font-size:14px;color:#bbb;line-height:1.6}

/* OL checklist */
.guide-body ol{margin:0 0 14px 0;list-style:none;counter-reset:steps}
.guide-body ol li{
  counter-increment:steps;display:flex;align-items:flex-start;gap:10px;
  padding:10px 12px;margin-bottom:3px;background:var(--bg2);border:1px solid var(--border);
  border-radius:8px;font-size:14px;color:#bbb;cursor:pointer;
  transition:background .1s;position:relative;user-select:none;line-height:1.5;
}
.guide-body ol li:hover{background:var(--bg3)}
.guide-body ol li::before{
  content:counter(steps);font-size:10px;color:var(--muted);
  background:#1a1a1a;border:1px solid var(--border);border-radius:4px;
  min-width:22px;height:22px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;margin-top:1px;font-family:var(--mono);transition:all .15s;
}
.guide-body ol li.done{color:var(--dim);text-decoration:line-through}
.guide-body ol li.done::before{content:'✓';color:var(--accent);border-color:rgba(0,204,102,.3);background:rgba(0,204,102,.08)}
.guide-body ol li.done *{color:var(--dim)!important}
.step-warn{
  display:none;position:absolute;top:-32px;left:0;
  background:#1a1a1a;border:1px solid var(--yellow);border-radius:6px;
  padding:4px 10px;font-size:12px;color:var(--yellow);white-space:nowrap;
  pointer-events:none;z-index:10;
}
.step-warn.show{display:block}

/* CODE */
.guide-body pre{
  background:#060606;border:1px solid var(--border);border-left:2px solid rgba(0,204,102,.4);
  border-radius:8px;padding:14px;overflow-x:auto;margin-bottom:14px;
  position:relative;-webkit-overflow-scrolling:touch;
}
.guide-body code{font-family:var(--mono);font-size:12px}
.guide-body pre code{color:#c9d1d9;font-size:12px;line-height:1.6}
.guide-body p code,.guide-body li code,.guide-body td code{
  background:#111;border:1px solid #1e1e1e;border-radius:4px;
  padding:1px 5px;font-size:12px;color:var(--accent);font-family:var(--mono);
}
.copy-wrap{position:relative}
.copy-btn{
  position:absolute;top:8px;right:8px;background:#1a1a1a;border:1px solid #222;
  border-radius:5px;padding:3px 8px;font:11px var(--mono);color:var(--muted);
  cursor:pointer;transition:all .12s;opacity:0;
}
.copy-wrap:hover .copy-btn,.copy-wrap:focus-within .copy-btn{opacity:1}
.copy-btn.ok{color:var(--accent);border-color:rgba(0,204,102,.3);opacity:1}

/* TABLE */
.guide-body table{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:13px;border:1px solid var(--border);border-radius:8px;overflow:hidden;display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
.guide-body th{background:var(--bg2);padding:8px 12px;text-align:left;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap}
.guide-body td{padding:8px 12px;border-bottom:1px solid #111;color:#bbb;vertical-align:top}
.guide-body tr:last-child td{border-bottom:none}

/* GUIDE NAV */
.guide-nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:32px;border-top:1px solid var(--border);padding-top:16px}
.gnav-link{padding:12px;background:var(--bg2);border:1px solid var(--border);text-decoration:none;color:var(--text);border-radius:8px;transition:border-color .12s,background .12s;display:block}
.gnav-link:hover{border-color:rgba(0,204,102,.2);background:var(--bg3)}
.gnav-link.next{text-align:right}
.gnav-lbl{font-size:10px;color:var(--muted);margin-bottom:3px;letter-spacing:.04em}
.gnav-title{font-size:12px;color:#bbb;line-height:1.4}

/* SEARCH RESULTS */
.search-results{margin-top:4px}
.sr-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px;background:var(--bg2);border:1px solid var(--border);
  border-radius:8px;margin-bottom:6px;text-decoration:none;color:var(--text);
  transition:background .1s;
}
.sr-item:hover,.sr-item:active{background:var(--bg3)}
.sr-title{font-size:14px;margin-bottom:2px;line-height:1.4}
.sr-sec{font-size:11px;color:var(--muted)}
.sr-empty{padding:32px 0;color:var(--muted);font-size:14px;text-align:center}

/* OVERLAY */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:98;backdrop-filter:blur(2px)}
.overlay.open{display:block}

/* DESKTOP */
@media(min-width:768px){
  .menu-btn{display:none}
  .hdr-gh{display:block}
  .sidebar{left:0;width:240px}
  .main{margin-left:240px}
  .content{padding:28px 32px 80px}
  .home-title{font-size:26px}
  .hdr-search{display:none}
  .sections-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px}
}
</style>
</head>
<body>

<header class="hdr">
  <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
  <a class="hdr-logo" href="/" onclick="return nav('/')"><span>~/</span>guides</a>
  <input class="hdr-search" type="search" id="hdrSearch" placeholder="search..." autocomplete="off" spellcheck="false">
  <a class="hdr-gh" href="https://github.com/eliekh05/guides" target="_blank" rel="noopener">github ↗</a>
</header>

<div class="overlay" id="overlay"></div>

<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main">
    <div class="content" id="content"></div>
  </main>
</div>

<script src="/js/guides-data.js"></script>
<script>
// ── Router ────────────────────────────────────────────────────────────────
function nav(path, push=true) {
  if(push) history.pushState({}, '', path);
  closeSidebar();
  const p = path;
  if(p === '/' || p === '') showHome();
  else if(p.startsWith('/s/')) showSection(p.slice(3));
  else if(p.startsWith('/g/')) showGuide(p.slice(3));
  else showHome();
  window.scrollTo(0, 0);
  return false;
}
window.addEventListener('popstate', () => nav(location.pathname, false));

// ── Sidebar ───────────────────────────────────────────────────────────────
function buildSidebar() {
  const sb = document.getElementById('sidebar');
  sb.innerHTML = '<div class="sb-root">sections</div>';
  SECTIONS.filter(s => s.guides.length).forEach(s => {
    const hdr = document.createElement('div');
    hdr.className = 'sb-sec';
    hdr.innerHTML = `<div class="sb-sec-hdr" id="sbh-${s.id}">
      <span>${s.title}</span>
      <span style="display:flex;align-items:center;gap:6px">
        <span class="sb-sec-count">${s.guides.length}</span>
        <span class="chev">›</span>
      </span>
    </div>
    <div class="sb-guides" id="sbg-${s.id}"></div>`;
    sb.appendChild(hdr);
    const list = document.getElementById('sbg-'+s.id);
    const secHdr = document.getElementById('sbh-'+s.id);
    secHdr.onclick = () => {
      const open = secHdr.classList.toggle('open');
      list.style.display = open ? 'block' : 'none';
    };
    s.guides.forEach(g => {
      const a = document.createElement('a');
      a.className = 'sb-link'; a.id = 'nav-'+g.slug;
      a.href = '/g/'+g.slug; a.textContent = g.title;
      a.onclick = e => { e.preventDefault(); nav('/g/'+g.slug); };
      list.appendChild(a);
    });
  });
}

function setActive(slug) {
  document.querySelectorAll('.sb-link').forEach(a => a.classList.toggle('active', a.id === 'nav-'+slug));
  if(slug) {
    const a = document.getElementById('nav-'+slug);
    if(a) {
      const list = a.closest('.sb-guides');
      const hdr = list?.previousElementSibling;
      if(list && hdr && !hdr.classList.contains('open')) {
        hdr.classList.add('open');
        list.style.display = 'block';
      }
      setTimeout(() => a.scrollIntoView({block:'nearest'}), 100);
    }
  }
}

// ── Home ──────────────────────────────────────────────────────────────────
function showHome() {
  document.title = 'OS & Installation Guides';
  setActive(null);
  const cards = SECTIONS.filter(s => s.guides.length).map(s => `
    <div class="sec-card" onclick="nav('/s/${s.id}')">
      <div class="sec-left">
        <div class="sec-num">${s.guides.length}</div>
        <div class="sec-name">${s.title}</div>
      </div>
      <div class="sec-arr">›</div>
    </div>`).join('');

  document.getElementById('content').innerHTML = `
    <div class="home-hero">
      <div class="home-title">OS &amp; <span>Installation</span> Guides</div>
      <div class="home-sub">Practical guides for problems that are hard to find solutions for online.</div>
    </div>
    <input class="search-bar-big" type="search" id="bigSearch" placeholder="Search ${ALL_GUIDES.length} guides..." autocomplete="off" spellcheck="false">
    <div id="search-results"></div>
    <div class="sections-grid" id="sections-grid">${cards}</div>
    <div class="notice warn">Read everything before typing any command. If you do not understand what a command does, you are not ready to run it.</div>
    <div class="notice info" style="margin-top:8px">Guides are written from real experience and official docs — steps may differ depending on your hardware, OS version, or configuration.</div>`;

  // Big search
  const bigSearch = document.getElementById('bigSearch');
  bigSearch.addEventListener('input', () => doSearch(bigSearch.value, 'search-results', 'sections-grid'));
  bigSearch.addEventListener('search', () => doSearch(bigSearch.value, 'search-results', 'sections-grid'));
}

// ── Section ───────────────────────────────────────────────────────────────
function showSection(id) {
  const sec = SECTIONS.find(s => s.id === id);
  if(!sec) { showHome(); return; }
  document.title = sec.title + ' — Guides';
  setActive(null);
  const items = sec.guides.map(g => `
    <a class="guide-item" href="/g/${g.slug}" onclick="return nav('/g/${g.slug}')">
      <span class="guide-item-title">${g.title}</span>
      <span class="guide-item-arr">›</span>
    </a>`).join('');
  document.getElementById('content').innerHTML = `
    <a class="back-btn" href="/" onclick="return nav('/')">← home</a>
    <div class="page-title">${sec.title}</div>
    <div class="page-sub">${sec.guides.length} guides</div>
    <div class="guide-list">${items}</div>`;
}

// ── Guide ─────────────────────────────────────────────────────────────────
async function showGuide(slug) {
  const guide = ALL_GUIDES.find(g => g.slug === slug);
  if(!guide) { showHome(); return; }
  const sec = SECTIONS.find(s => s.guides.some(g => g.slug === slug));
  setActive(slug);
  document.title = guide.title + ' — Guides';
  document.getElementById('content').innerHTML = '<div style="padding:40px 0;color:var(--muted);font-size:13px;text-align:center">loading...</div>';
  try {
    const resp = await fetch('/guides/'+slug+'.html');
    if(!resp.ok) throw new Error();
    const raw = await resp.text();
    const html = raw.split('\n').slice(2).join('\n');
    const backPath = sec ? '/s/'+sec.id : '/';
    const backLabel = sec ? '← '+sec.title : '← home';
    document.getElementById('content').innerHTML = `
      <a class="back-btn" href="${backPath}" onclick="return nav('${backPath}')">${backLabel}</a>
      <div class="guide-body" id="gbody">${html}</div>
      <div id="gnav"></div>`;
    addCopyBtns();
    addChecklist();
    buildGuideNav(slug, sec);
  } catch(e) {
    document.getElementById('content').innerHTML = `
      <a class="back-btn" href="/" onclick="return nav('/')">← home</a>
      <div style="color:var(--red);font-size:14px;padding:20px 0">Could not load guide.</div>`;
  }
}

// ── Checklist ─────────────────────────────────────────────────────────────
function addChecklist() {
  document.querySelectorAll('.guide-body ol').forEach(ol => {
    const items = [...ol.querySelectorAll('li')];
    items.forEach((li, i) => {
      const warn = document.createElement('span');
      warn.className = 'step-warn';
      warn.textContent = `Complete step ${i} first`;
      li.insertBefore(warn, li.firstChild);
      li.addEventListener('click', () => {
        if(li.classList.contains('done')) { li.classList.remove('done'); return; }
        const prev = items.slice(0, i).filter(p => !p.classList.contains('done'));
        if(prev.length > 0) {
          warn.classList.add('show');
          setTimeout(() => warn.classList.remove('show'), 2000);
          prev[0].scrollIntoView({block:'nearest', behavior:'smooth'});
          return;
        }
        li.classList.add('done');
      });
    });
  });
}

// ── Copy buttons ──────────────────────────────────────────────────────────
function addCopyBtns() {
  document.querySelectorAll('.guide-body pre').forEach(pre => {
    const wrap = document.createElement('div');
    wrap.className = 'copy-wrap';
    pre.parentNode.insertBefore(wrap, pre);
    wrap.appendChild(pre);
    const btn = document.createElement('button');
    btn.className = 'copy-btn'; btn.textContent = 'copy';
    btn.onclick = () => {
      const text = pre.querySelector('code')?.textContent || pre.textContent;
      navigator.clipboard.writeText(text).then(() => {
        btn.textContent = 'copied!'; btn.classList.add('ok');
        setTimeout(() => { btn.textContent = 'copy'; btn.classList.remove('ok'); }, 1500);
      });
    };
    wrap.appendChild(btn);
  });
}

// ── Guide nav ─────────────────────────────────────────────────────────────
function buildGuideNav(slug, sec) {
  if(!sec) return;
  const idx = sec.guides.findIndex(g => g.slug === slug);
  const prev = idx > 0 ? sec.guides[idx-1] : null;
  const next = idx < sec.guides.length-1 ? sec.guides[idx+1] : null;
  if(!prev && !next) return;
  document.getElementById('gnav').innerHTML = `
    <div class="guide-nav">
      ${prev ? `<a class="gnav-link" href="/g/${prev.slug}" onclick="return nav('/g/${prev.slug}')"><div class="gnav-lbl">← prev</div><div class="gnav-title">${prev.title}</div></a>` : '<div></div>'}
      ${next ? `<a class="gnav-link next" href="/g/${next.slug}" onclick="return nav('/g/${next.slug}')"><div class="gnav-lbl">next →</div><div class="gnav-title">${next.title}</div></a>` : '<div></div>'}
    </div>`;
}

// ── Search ────────────────────────────────────────────────────────────────
function hl(t, q) {
  return t.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),
    '<mark style="background:rgba(0,204,102,.15);color:var(--accent);border-radius:2px">$1</mark>');
}

function doSearch(q, resultsId, hideId) {
  const resultsEl = document.getElementById(resultsId);
  const hideEl = hideId ? document.getElementById(hideId) : null;
  q = q.trim().toLowerCase();
  if(q.length < 2) {
    if(resultsEl) resultsEl.innerHTML = '';
    if(hideEl) hideEl.style.display = '';
    return;
  }
  if(hideEl) hideEl.style.display = 'none';
  const words = q.split(/\s+/);
  const results = ALL_GUIDES.map(g => {
    const t = g.title.toLowerCase();
    let sc = 0;
    if(t === q) sc = 100;
    else if(t.startsWith(q)) sc = 80;
    else if(words.every(w => t.includes(w))) sc = 60;
    else if(t.includes(q)) sc = 50;
    else sc = words.filter(w => t.includes(w)).length * 15;
    if(!sc && g.preview?.toLowerCase().includes(q)) sc = 5;
    return {g, sc};
  }).filter(x => x.sc > 0).sort((a,b) => b.sc - a.sc).slice(0, 12).map(x => x.g);

  resultsEl.innerHTML = results.length ? `<div class="search-results">${results.map(g => `
    <a class="sr-item" href="/g/${g.slug}" onclick="return nav('/g/${g.slug}')">
      <div><div class="sr-title">${hl(g.title, q)}</div><div class="sr-sec">${g.parent.toLowerCase()}</div></div>
      <span style="color:var(--dim);font-size:14px">›</span>
    </a>`).join('')}</div>` : '<div class="sr-empty">No results found</div>';
}

// Header search (mobile)
document.getElementById('hdrSearch').addEventListener('input', e => {
  const q = e.target.value;
  if(q.length >= 2) {
    // navigate to home with search
    if(location.pathname !== '/') nav('/', false);
    showHome();
    setTimeout(() => {
      const big = document.getElementById('bigSearch');
      if(big) { big.value = q; doSearch(q, 'search-results', 'sections-grid'); }
    }, 50);
  }
});

// ── Mobile sidebar ────────────────────────────────────────────────────────
document.getElementById('menuBtn').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('open');
});
document.getElementById('overlay').addEventListener('click', closeSidebar);
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}

// ── Init ──────────────────────────────────────────────────────────────────
buildSidebar();
nav(location.pathname, false);
</script>
